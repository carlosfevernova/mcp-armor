version: 2
updates:
  # npm — monthly grouped bumps, max 2 open PRs. Reduces noise on a young repo.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      all-npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Skip major bumps by default — breaking changes should be evaluated manually.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — applies once a workflow is added, no-op until then.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
